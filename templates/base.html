<!DOCTYPE html>
<html lang="ru" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ service }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/catalog.css?v=3">
</head>
<body>
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>{{ service }}</a>
      <nav class="site-nav" aria-label="Разделы">
        <a class="{% if request.url.path == '/' or request.url.path.startswith('/games') %}is-current{% endif %}" href="/">Список</a>
        <a class="{% if request.url.path == '/process' %}is-current{% endif %}" href="/process">Процесс</a>
      </nav>
    </div>
  </header>
  <main class="container page">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
